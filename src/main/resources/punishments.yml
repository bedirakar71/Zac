punishments:
  escalate-kick-to-ban: true
  kick-at-vl: 12.0
  ban-at-vl: 18.0
  max-kicks-before-ban: 2
  ban-duration-days: 7
  notify-staff-in-chat: true
  log-to-console: true

environment:
  allow-impact-damage: true
  elytra-safe-mode: true
  freeze-on-low-signals: false
  viaversion-compatibility: true

decoy:
  enabled: true
  auto-spawn-min-vl: 5.5
  auto-spawn-min-score: 0.65
  spawn-on-suspicious-hit: false
  radius-blocks: 2.3
  duration-ticks: 120
  lock-fov-deg: 7.5
  freeze-on-decoy-lock: false
  min-lock-ticks-for-score: 10
  lock-score-threshold: 0.85
  vl-per-decoy-flag: 1.20

movement:
  horiz-offset-threshold: 0.42
  horiz-severe-threshold: 0.72
  min-sustained-window-ms: 1200
  min-sustained-hits: 4
  horiz-vl-for-punish: 10.0

combat:
  max-reach-blocks: 3.30
  lag-extra-tolerance: 0.55
  vl-per-reach-cancel: 1.10
  block-back-hits: true
  max-attack-look-angle-deg: 105.0
  snap-turn-min-deg: 75.0
  snap-window-ms: 180
  vl-per-back-hit: 0.80
  block-wall-hits: true
  vl-per-wall-hit: 1.50
  block-cobweb-hits: false
  vl-per-cobweb-hit: 0.50
  # Duz vuruslarda false atmamasi icin tamamen kapali
  block-fake-criticals: false
  min-fake-crit-streak: 999
  vl-per-fake-crit: 0.0

killaura-aimassist:
  enabled: true
  min-hits-in-window: 6
  max-aim-error-deg: 1.40
  score-threshold: 0.78
  vl-per-flag: 1.80
  
