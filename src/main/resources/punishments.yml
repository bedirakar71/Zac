punishments:
  escalate-kick-to-ban: true
  kick-at-vl: 8.5
  ban-at-vl: 13.5
  max-kicks-before-ban: 2
  ban-duration-days: 7
  notify-staff-in-chat: true
  log-to-console: true

environment:
  allow-impact-damage: true
  elytra-safe-mode: true
  freeze-on-low-signals: false

decoy:
  enabled: true
  auto-spawn-min-vl: 4.5
  radius-blocks: 2.4
  duration-ticks: 100
  lock-fov-deg: 11.5
  freeze-on-decoy-lock: false
  min-lock-ticks-for-score: 6
  lock-score-threshold: 0.72
  vl-per-decoy-flag: 1.40

movement:
  horiz-offset-threshold: 0.16
  horiz-severe-threshold: 0.38
  min-consecutive-horiz-flags: 3
  horiz-vl-for-punish: 6.5

combat:
  max-reach-blocks: 3.30
  lag-extra-tolerance: 0.45
  vl-per-reach-cancel: 1.15
  block-back-hits: true
  max-attack-look-angle-deg: 74.0
  snap-turn-min-deg: 44.0
  snap-window-ms: 380
  vl-per-back-hit: 1.85
  block-wall-hits: true
  vl-per-wall-hit: 1.60
  block-cobweb-hits: true
  vl-per-cobweb-hit: 1.25
  block-fake-criticals: true
  min-fake-crit-streak: 6
  vl-per-fake-crit: 1.25

killaura-aimassist:
  enabled: true
  min-hits-in-window: 4
  max-aim-error-deg: 2.40
  score-threshold: 0.64
  vl-per-flag: 1.75
  
