punishments:
  escalate-kick-to-ban: true
  kick-at-vl: 7.5
  ban-at-vl: 12.0
  max-kicks-before-ban: 2
  ban-duration-days: 7
  notify-staff-in-chat: true
  log-to-console: true

combat:
  max-reach-blocks: 3.25
  lag-extra-tolerance: 0.40
  vl-per-reach-cancel: 1.15
  block-back-hits: true
  max-attack-look-angle-deg: 78.0
  vl-per-back-hit: 1.75
  block-wall-hits: true
  vl-per-wall-hit: 1.60
  block-cobweb-hits: true
  vl-per-cobweb-hit: 1.25
  # Her vurusta sahte kritik (Criticals hilesi) engeli
  block-fake-criticals: true
  vl-per-fake-crit: 1.45

killaura-aimassist:
  enabled: true
  min-hits-in-window: 4
  max-aim-error-deg: 2.50
  score-threshold: 0.62
  vl-per-flag: 1.65
  
