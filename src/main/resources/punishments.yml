punishments:
  escalate-kick-to-ban: true
  kick-at-vl: 7.5
  ban-at-vl: 12.0
  max-kicks-before-ban: 2
  ban-duration-days: 7
  notify-staff-in-chat: true
  log-to-console: true

combat:
  # Guvenli PvP/BoxPvP esigi: lag disinda 3.25 blok ustu vuruslar iptal edilir
  max-reach-blocks: 3.25
  lag-extra-tolerance: 0.40
  vl-per-reach-cancel: 1.15
  # Duvar / katı blok arkasindan vurmayi engelle
  block-wall-hits: true
  vl-per-wall-hit: 1.60
  # Ag (cobweb) icinden veya ag icindeki hedefe hileli vurusu iptal et
  block-cobweb-hits: true
  vl-per-cobweb-hit: 1.25

killaura-aimassist:
  enabled: true
  min-hits-in-window: 5
  max-aim-error-deg: 2.35
  score-threshold: 0.68
  vl-per-flag: 1.50
  
