punishments:
  escalate-kick-to-ban: true
  kick-at-vl: 9.0
  ban-at-vl: 14.5
  max-kicks-before-ban: 2
  ban-duration-days: 7
  notify-staff-in-chat: true
  log-to-console: true

environment:
  allow-impact-damage: true
  elytra-safe-mode: true
  freeze-on-low-signals: false
  viaversion-compatibility: true

decoy:
  enabled: true
  auto-spawn-min-vl: 2.0
  auto-spawn-min-score: 0.30
  spawn-on-suspicious-hit: true
  radius-blocks: 2.1
  duration-ticks: 200
  lock-fov-deg: 15.0
  freeze-on-decoy-lock: false
  min-lock-ticks-for-score: 3
  lock-score-threshold: 0.34
  vl-per-decoy-flag: 1.95

movement:
  horiz-offset-threshold: 0.38
  horiz-severe-threshold: 0.65
  min-sustained-window-ms: 1100
  min-sustained-hits: 3
  horiz-vl-for-punish: 8.5

combat:
  max-reach-blocks: 3.32
  lag-extra-tolerance: 0.50
  vl-per-reach-cancel: 1.50
  block-back-hits: true
  max-attack-look-angle-deg: 95.0
  snap-turn-min-deg: 56.0
  snap-window-ms: 260
  vl-per-back-hit: 1.45
  block-wall-hits: true
  vl-per-wall-hit: 2.10
  block-cobweb-hits: false
  vl-per-cobweb-hit: 0.60
  block-fake-criticals: false
  min-fake-crit-streak: 999
  vl-per-fake-crit: 0.0

killaura-aimassist:
  enabled: true
  min-hits-in-window: 5
  max-aim-error-deg: 1.95
  score-threshold: 0.54
  vl-per-flag: 2.15
  
