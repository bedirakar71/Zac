name: ZornoAimGuard
version: 2.1.0
main: com.zornoely.aimguard.ZornoAimGuardPlugin
api-version: '1.21'
author: ZornoEly
commands:
  zornoaimguard:
    description: ZornoAimGuard ana yonetim ve ban komutlari
    usage: /<command> <stats|decoy|reset|reload|ban> ...
    permission: zornoaimguard.admin
    aliases: [aimguard]
permissions:
  zornoaimguard.admin:
    description: ZornoAimGuard komutlarini kullanma yetkisi
    default: op
  zornoaimguard.bypass:
    description: Anti-cheat kontrollerinden muafiyet
    default: false
    
