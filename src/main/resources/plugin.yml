name: ZornoAimGuard
version: 2.4.0
main: com.zornoely.aimguard.ZornoAimGuardPlugin
api-version: '1.21'
softdepend:
  - PacketEvents
  - ViaVersion

commands:
  zornoaimguard:
    description: ZornoAimGuard yonetim komutlari
    usage: /zornoaimguard <stats|decoy|reset|reload|ban>
    permission: zornoaimguard.admin

permissions:
  zornoaimguard.admin:
    description: ZornoAimGuard komutlarini kullanma yetkisi
    default: op
  zornoaimguard.bypass:
    description: ZornoAimGuard kontrollerinden muafiyet
    default: false
    
